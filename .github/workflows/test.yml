# 测试闸门。Cloudflare Workers Builds 在 push 到 main 时独立地构建部署，它不会等这个
# workflow —— 真正拦住坏部署的是 package.json 里 `deploy` 脚本前置的 `npm test`。
# 这里的作用是让失败在 PR 和 commit 上可见，而不必去翻 Cloudflare 的构建日志。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # 变异测试是真正在验证「测试有没有用」的那一层，见 README 的「测试 -> 四、变异测试」。
      # INVARIANT_CASES 调小是拿样本量换时间：变异测试要把整个套件跑几十遍。
      - run: npm run mutate
        env:
          INVARIANT_CASES: "500"
